<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Planner — Выбор приложения</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6b 50%, #1e3a5f 100%);
            padding: 20px;
        }
        .container { max-width: 560px; width: 100%; text-align: center; }
        .logo { font-size: 4em; margin-bottom: 16px; }
        .title { color: white; font-size: 1.8em; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 1em; margin-bottom: 40px; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 36px 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: white;
            display: block;
        }
        .card:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.2); }
        .card:active { transform: scale(0.97); }
        .card-icon { font-size: 3.5em; margin-bottom: 14px; }
        .card-title { font-size: 1.3em; font-weight: 700; margin-bottom: 8px; }
        .card-desc { font-size: 0.85em; opacity: 0.7; line-height: 1.5; }
        .footer { color: rgba(255,255,255,0.4); font-size: 0.78em; margin-top: 32px; }
        .clear-cache {
            margin-top: 24px; background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3); color: rgba(255,200,200,0.8);
            padding: 8px 16px; border-radius: 10px; font-size: 0.78em;
            cursor: pointer; font-family: inherit;
        }
        .clear-cache:hover { background: rgba(239,68,68,0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💪</div>
        <div class="title">Fitness Planner</div>
        <div class="subtitle">Выберите приложение</div>
        <div class="cards">
            <a href="trainer/" class="card">
                <div class="card-icon">👨‍🏫</div>
                <div class="card-title">Тренер</div>
                <div class="card-desc">Управление клиентами, программы питания и тренировок, календарь, файлы</div>
            </a>
            <a href="client/" class="card">
                <div class="card-icon">👤</div>
                <div class="card-title">Клиент</div>
                <div class="card-desc">Ваши программы, отметка выполнения, прогресс, чат с тренером</div>
            </a>
        </div>
        <button class="clear-cache" onclick="clearOldCache()">🔄 Очистить старый кеш</button>
        <div class="footer">Fitness Planner Israel · v2026</div>
    </div>
    <script>
    function clearOldCache() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(r) {
                r.forEach(function(reg) { reg.unregister(); });
            });
        }
        if ('caches' in window) {
            caches.keys().then(function(names) { names.forEach(function(n) { caches.delete(n); }); });
        }
        alert('✅ Кеш очищен! Обновите страницу (Ctrl+Shift+R).');
        location.reload();
    }
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) {
                if (reg.scope.indexOf('/trainer/') < 0 && reg.scope.indexOf('/client/') < 0) {
                    reg.unregister();
                }
            });
        });
    }
    </script>
</body>
</html>
